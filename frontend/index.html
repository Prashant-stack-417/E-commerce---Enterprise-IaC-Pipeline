<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>E-Commerce Store</h2>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Secure E-Commerce Platform</h1>
        <p>Shop Electronics with Confidence</p>
        <button>Explore Products</button>
    </section>

    <!-- Main Heading -->
    <h1>Welcome to E-Commerce Enterprise DevSecOps Pipeline</h1>

    <!-- Products Section -->
    <div class="products">

        <div class="product">
            <img src="https://picsum.photos/250/150?random=1" alt="Laptop">
            <h3>Laptop</h3>
            <p>Price: ₹50,000</p>
            <p>⭐⭐⭐⭐⭐ (4.8)</p>
            <button onclick="buyProduct('Laptop')">Buy Now</button>
        </div>

        <div class="product">
           <img src="https://picsum.photos/250/150?random=2" alt="Mobile">
            <h3>Mobile</h3>
            <p>Price: ₹20,000</p>
            <p>⭐⭐⭐⭐⭐ (4.7)</p>
            <button onclick="buyProduct('Mobile')">Buy Now</button>
        </div>

        <div class="product">
           <img src="https://picsum.photos/250/150?random=3" alt="Smartphone">
            <h3>Smartphone</h3>
            <p>Price: ₹15,000</p>
            <p>⭐⭐⭐⭐⭐ (4.6)</p>
            <button onclick="buyProduct('Smartphone')">Buy Now</button>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 E-Commerce Enterprise DevSecOps Pipeline</p>
    </footer>

    <!-- JavaScript -->
    <script>
        function buyProduct(productName) {
            alert(productName + " added to cart!");
        }
    </script>

</body>
</html>
