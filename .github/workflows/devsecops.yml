name: DevSecOps Pipeline

on:
  push:
    branches:
      - Development
  pull_request:
    branches:
      - main
      - Development

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Sonar Configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::SONAR_TOKEN is missing. Add it in repository or organization secrets."
            exit 1
          fi
          if [ -z "${SONAR_HOST_URL}" ]; then
            echo "::warning::SONAR_HOST_URL is not set. This is required for SonarQube Server and optional for SonarQube Cloud."
          fi

      - name: Sonar Host Reachability Check
        id: sonar_preflight
        shell: bash
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_HOST_URL}" ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Sonar scan because SONAR_HOST_URL is not configured."
            exit 0
          fi

          if [[ "${SONAR_HOST_URL}" =~ localhost|127\.0\.0\.1|0\.0\.0\.0 ]]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Sonar scan because SONAR_HOST_URL (${SONAR_HOST_URL}) points to localhost and is unreachable from GitHub-hosted runners."
            exit 0
          fi

          STATUS_CODE=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 15 "${SONAR_HOST_URL}/api/v2/analysis/version" || echo "000")
          if [ "$STATUS_CODE" = "200" ] || [ "$STATUS_CODE" = "401" ] || [ "$STATUS_CODE" = "403" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "Sonar host is reachable from this runner (HTTP ${STATUS_CODE})."
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Sonar scan because Sonar host is unreachable from this runner (HTTP ${STATUS_CODE})."
          fi

      - name: Build Docker Image
        run: docker build -t ecommerce-app .

      - name: SonarQube Scan
        if: ${{ steps.sonar_preflight.outputs.reachable == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          skipSignatureVerification: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Scan Skipped
        if: ${{ steps.sonar_preflight.outputs.reachable != 'true' }}
        run: |
          echo "SonarQube scan skipped. Configure a publicly reachable SONAR_HOST_URL or use a self-hosted runner on the same network as SonarQube."