name: DevSecOps Enterprise Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest app/tests/

  sonarqube:
    name: SonarQube SAST Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  dependency-scan:
    name: Dependency Scan (SCA)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit SCA
        run: pip-audit -r requirements.txt

  checkov-iac:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  docker-trivy-image:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: [sonarqube, dependency-scan, checkov-iac, trivy-fs]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Local Image
        run: |
          docker build -t ecommerce-app:${{ github.sha }} -f app/Dockerfile .

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce-app:${{ github.sha }}'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  k8s-validate:
    name: Kubernetes Dry-run Deploy
    runs-on: ubuntu-latest
    needs: docker-trivy-image
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f kubernetes/deployment.yaml
          kubectl apply --dry-run=client -f kubernetes/service.yaml
          kubectl apply --dry-run=client -f kubernetes/ingress.yaml

  dast-zap:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    needs: k8s-validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080/health'
          allow_issue_writing: false
          fail_action: true
